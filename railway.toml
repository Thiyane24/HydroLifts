# railway.toml — config para o serviço backend FastAPI
# Documentação: https://docs.railway.com/reference/config-as-code
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Variáveis a configurar manualmente no dashboard Railway:
#   Secret_Key         — uma string longa aleatória (ex.: openssl rand -hex 32)
#   Hashing_Algorithm  — HS256
#   ACCESS_TOKEN_EXPIRE_MINUTES — 60
#   Database_URL       — vem automático se adicionares o plugin Postgres
#   ALLOWED_ORIGINS    — URL pública do frontend Vercel (separada por vírgula)
