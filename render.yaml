# render.yaml — Infrastructure as Code
# Deploy: https://dashboard.render.com/select-repo?blueprint=render.yaml
#
# NOTA: a base de dados vive no Supabase (projecto esruhasnbxdtfgnlonfq,
# região AWS ap-southeast-2). A connection string é definida manualmente em
# Render → hydrolifts-api → Environment → DATABASE_URL (o painel aceita-a
# como secret). Este ficheiro NÃO inclui a password.

services:
  - type: web
    name: hydrolifts-api
    runtime: python
    plan: free           # muda para "starter" se quiseres evitar cold-starts
    region: oregon
    rootDir: .
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir app --workers 2"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: Secret_Key
        generateValue: true   # gera string aleatória segura
      - key: Hashing_Algorithm
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: PYTHONPATH
        value: /opt/render/project/src/app
      - key: ALLOWED_ORIGINS
        sync: false           # define manualmente para a URL do Vercel
      - key: DATABASE_URL
        sync: false           # connection string do Supabase — definida
                              # manualmente em Environment (NÃO commitada)
